<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Study for Kids</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ========== LANGUAGE TOGGLE ========== -->
    <div id="lang-toggle" class="lang-toggle">
        <button id="btn-lang-en" class="lang-btn active" type="button" title="English">
            <svg width="30" height="20" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="40" fill="#B22234"/>
                <rect y="3.08" width="60" height="3.08" fill="white"/>
                <rect y="9.23" width="60" height="3.08" fill="white"/>
                <rect y="15.38" width="60" height="3.08" fill="white"/>
                <rect y="21.54" width="60" height="3.08" fill="white"/>
                <rect y="27.69" width="60" height="3.08" fill="white"/>
                <rect y="33.85" width="60" height="3.08" fill="white"/>
                <rect width="24" height="21.54" fill="#3C3B6E"/>
            </svg>
        </button>
        <button id="btn-lang-he" class="lang-btn" type="button" title="עברית">
            <svg width="30" height="20" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="40" fill="white"/>
                <rect y="2" width="60" height="8" fill="#0038b8"/>
                <rect y="30" width="60" height="8" fill="#0038b8"/>
                <polygon points="30,10 36.5,22 23.5,22" fill="none" stroke="#0038b8" stroke-width="2"/>
                <polygon points="30,26 23.5,14 36.5,14" fill="none" stroke="#0038b8" stroke-width="2"/>
            </svg>
        </button>
    </div>

    <!-- ========== CONFIGURATION SCREEN ========== -->
    <div id="config-screen" class="screen active">
        <h1 data-i18n="title">🧮 Math Study</h1>
        <p class="subtitle" data-i18n="subtitle">Pick your topics and let's practice!</p>

        <div class="topic-grid">
            <!-- Addition -->
            <div class="topic-card" data-topic="addition">
                <label class="topic-check">
                    <input type="checkbox" id="chk-addition" checked>
                    <span class="topic-label" data-i18n="addition">➕ Addition</span>
                </label>
                <select id="range-addition" class="range-select">
                    <option value="10">0 – 10</option>
                    <option value="20">0 – 20</option>
                    <option value="100">0 – 100</option>
                </select>
            </div>

            <!-- Subtraction -->
            <div class="topic-card" data-topic="subtraction">
                <label class="topic-check">
                    <input type="checkbox" id="chk-subtraction" checked>
                    <span class="topic-label" data-i18n="subtraction">➖ Subtraction</span>
                </label>
                <select id="range-subtraction" class="range-select">
                    <option value="10">0 – 10</option>
                    <option value="20">0 – 20</option>
                    <option value="100">0 – 100</option>
                </select>
            </div>

            <!-- Multiplication -->
            <div class="topic-card" data-topic="multiplication">
                <label class="topic-check">
                    <input type="checkbox" id="chk-multiplication" checked>
                    <span class="topic-label" data-i18n="multiplication">✖️ Multiplication</span>
                </label>
                <select id="range-multiplication" class="range-select">
                    <option value="10">0 – 10</option>
                    <option value="20">0 – 20</option>
                    <option value="100">0 – 100</option>
                </select>
            </div>

            <!-- Division -->
            <div class="topic-card" data-topic="division">
                <label class="topic-check">
                    <input type="checkbox" id="chk-division" checked>
                    <span class="topic-label" data-i18n="division">➗ Division</span>
                </label>
                <select id="range-division" class="range-select">
                    <option value="10">0 – 10</option>
                    <option value="20">0 – 20</option>
                    <option value="100">0 – 100</option>
                </select>
            </div>
        </div>

        <button id="btn-start" class="btn-primary" data-i18n="start">Start! 🚀</button>
        <p id="config-error" class="error-msg hidden" data-i18n="configError">Please select at least one topic.</p>
    </div>

    <!-- ========== QUESTION SCREEN ========== -->
    <div id="question-screen" class="screen">
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-text" class="progress-text" data-i18n="progress">Question 1 / 10</p>

        <div id="question-box" class="question-box">
            <span id="question-text">7 + 5 = ?</span>
        </div>

        <div id="feedback-emoji" class="feedback-emoji hidden"></div>

        <div id="options-container" class="options-container">
            <button class="btn-option" data-index="0">12</button>
            <button class="btn-option" data-index="1">10</button>
            <button class="btn-option" data-index="2">14</button>
            <button class="btn-option" data-index="3">11</button>
        </div>
    </div>

    <!-- ========== SUMMARY SCREEN ========== -->
    <div id="summary-screen" class="screen">
        <h1 data-i18n="stageComplete">🎉 Stage Complete!</h1>
        <p id="summary-score" class="summary-score" data-i18n="summaryScore">8 / 10 on first try!</p>
        <div class="summary-emoji">🎉</div>
        <button id="btn-play-again" class="btn-primary" data-i18n="playAgain">Play Again 🔄</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
